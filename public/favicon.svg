<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#0ea5e9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>

    <!-- Primary Accent Gradient (G emblem) -->
    <linearGradient id="gGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Inner Ambient Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0ea5e9" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with high-tech outline -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="12" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#centerGlow)" />

  <!-- Geometric Monogram "G" (System Architecture Emblem) -->
  <g filter="url(#shadow)">
    <!-- Main Outer Loop of "G" -->
    <path d="M 335 155 
             C 305 125, 250 115, 200 135
             C 145 160, 110 215, 110 275
             C 110 350, 160 405, 235 405
             C 310 405, 365 360, 375 295
             L 375 260
             L 250 260
             L 250 310
             L 320 310
             C 312 340, 275 360, 235 360
             C 185 360, 155 320, 155 272
             C 155 225, 185 175, 240 165
             C 275 160, 305 172, 325 195
             Z" 
          fill="url(#gGrad)" />

    <!-- Modern Architectural Core Node (Cyber Pulse) -->
    <circle cx="250" cy="210" r="14" fill="#38bdf8" />
    <circle cx="250" cy="210" r="24" fill="#38bdf8" fill-opacity="0.3" />
  </g>
</svg>
