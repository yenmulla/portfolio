<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow-cyan)" />
  <rect width="1200" height="630" fill="url(#glow-purple)" />

  <!-- Outer Card Frame -->
  <rect x="50" y="50" width="1100" height="530" rx="20" fill="#0f172a" fill-opacity="0.6" stroke="url(#card-border)" stroke-width="1.5" />

  <!-- Top Badge -->
  <g transform="translate(100, 110)">
    <circle cx="6" cy="6" r="5" fill="#10b981" />
    <circle cx="6" cy="6" r="10" fill="#10b981" fill-opacity="0.25" />
    <text x="24" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="15" font-weight="600" fill="#38bdf8" letter-spacing="1.5">JEFF.MOONLIST.SITE  •  OFFICIAL TECHNICAL PORTFOLIO</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">Geoffrey Mwangi (Jeff)</text>
  
  <!-- Subtitle -->
  <text x="100" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="26" font-weight="600" fill="#94a3b8">Software Engineer &amp; System Architect</text>
  
  <!-- Description -->
  <text x="100" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="19" font-weight="400" fill="#cbd5e1">System architecture, EVM smart contracts, cross-platform mobile apps &amp; scalable web systems.</text>

  <!-- Skills Pills -->
  <g transform="translate(100, 375)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="195" height="42" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1" />
    <text x="16" y="26" font-family="monospace" font-size="14" font-weight="600" fill="#38bdf8">Moonlist Ecosystem</text>

    <!-- Pill 2 -->
    <rect x="210" y="0" width="165" height="42" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1" />
    <text x="226" y="26" font-family="monospace" font-size="14" font-weight="600" fill="#a5b4fc">Flutter &amp; Mobile</text>

    <!-- Pill 3 -->
    <rect x="390" y="0" width="165" height="42" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
    <text x="406" y="26" font-family="monospace" font-size="14" font-weight="600" fill="#d8b4fe">Solidity &amp; EVM</text>

    <!-- Pill 4 -->
    <rect x="570" y="0" width="185" height="42" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1" />
    <text x="586" y="26" font-family="monospace" font-size="14" font-weight="600" fill="#86efac">React &amp; TypeScript</text>
  </g>

  <!-- Bottom Meta Bar -->
  <g transform="translate(100, 510)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#64748b">📍 Nairobi, Kenya</text>
    <text x="200" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#64748b">🐙 github.com/yenmulla</text>
    <text x="470" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#64748b">✈️ t.me/moon_jeff</text>
    <text x="700" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#38bdf8">✉️ jeff@app.moonlist.app</text>
  </g>
</svg>

